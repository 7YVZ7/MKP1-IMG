<div id="actorText" class="actorText"></div>
</div></div>
<script>
const base=document.getElementById('base'), mag=document.getElementById('mag'),
      mi=document.getElementById('magimg'), at=document.getElementById('actorText');
const S=1.55;

function showUsecase(h){
 const x=+h.dataset.x,y=+h.dataset.y,w=+h.dataset.w,hh=+h.dataset.h;
 const W=base.clientWidth,H=base.clientHeight, cw=w*W,ch=hh*H,mw=cw*S,mh=ch*S;
 let L=(x+w/2)*W-mw/2,T=(y+hh/2)*H-mh/2;
 L=Math.max(0,Math.min(W-mw,L)); T=Math.max(0,Math.min(H-mh,T));
 mag.style.left=L+'px';mag.style.top=T+'px';mag.style.width=mw+'px';mag.style.height=mh+'px';
 mi.style.width=(W*S)+'px';mi.style.height=(H*S)+'px';
 mi.style.left=(mw/2-(x+w/2)*W*S)+'px';
 mi.style.top=(mh/2-(y+hh/2)*H*S)+'px';
 mag.style.display='block'; at.style.display='none';
}

function showActorText(h){
 mag.style.display='none';
 const W=base.clientWidth,H=base.clientHeight;
 const tx=+h.dataset.tx,ty=+h.dataset.ty,tw=+h.dataset.tw,th=+h.dataset.th;
 // White rectangle deliberately covers ONLY the original caption.
 const extraW=tw*W*0.22, extraH=th*H*0.42;
 let L=tx*W-extraW/2, T=ty*H-extraH/2;
 let WW=tw*W+extraW, HH=th*H+extraH;
 L=Math.max(0,Math.min(W-WW,L));
 at.style.left=L+'px'; at.style.top=T+'px'; at.style.width=WW+'px'; at.style.height=HH+'px';
 at.style.fontSize=Math.max(18,Math.round(H*0.022))+'px';
 at.textContent=h.dataset.label;
 at.style.display='flex';
}

function hide(){mag.style.display='none';at.style.display='none'}
document.querySelectorAll('.usecase').forEach(h=>{
 h.addEventListener('mouseenter',()=>showUsecase(h));h.addEventListener('mouseleave',hide);
});
document.querySelectorAll('.actor').forEach(h=>{
 h.addEventListener('mouseenter',()=>showActorText(h));h.addEventListener('mouseleave',hide);
});
window.addEventListener('resize',hide);
</script></body></html>
